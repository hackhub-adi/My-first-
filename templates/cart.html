{% extends 'base.html' %}

{% block content %}
<h2>Your Shopping Cart</h2>
{% if cart %}
    <table class="cart-table">
        <thead>
            <tr>
                <th>Product</th>
                <th>Price</th>
                <th>Action</th>
            </tr>
        </thead>
        <tbody>
            {% for item in cart %}
            <tr>
                <td>{{ item.name }}</td>
                <td>₹{{ item.price }}</td>
                <td><a href="{{ url_for('remove_from_cart', product_id=item.id) }}" class="btn-danger">Remove</a></td>
            </tr>
            {% endfor %}
        </tbody>
        <tfoot>
            <tr>
                <td><strong>Total</strong></td>
                <td><strong>₹{{ total }}</strong></td>
                <td></td>
            </tr>
        </tfoot>
    </table>
    <div class="cart-actions">
        <a href="{{ url_for('checkout') }}" class="btn btn-primary">Proceed to Checkout</a>
    </div>
{% else %}
    <p>Your cart is empty.</p>
    <a href="{{ url_for('index') }}" class="btn">Continue Shopping</a>
{% endif %}
{% endblock %}
